{% extends 'service/home.html' %}
{% block content %}
{% if validlink %}
    <h2>Придумайте новый пароль</h2>
    <form method="post">
         {% csrf_token %}
         {{ form.as_p }}
         <button type="submit">Сохранить новый пароль</button>
    </form>
{% else %}
    <h2>Ошибка ссылки</h2>
    <p>Ссылка для восстановления недействительна или устарела. Пожалуйста, запросите восстановление заново.</p>
{% endif %}
{% endblock %}
