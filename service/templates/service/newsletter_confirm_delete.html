{% extends 'service/home.html' %}
{% block content %}
<div class="row text-center">
    <form method="post" enctype="multipart/form-data">
        <div class="card mb-4 box-shadow">
            <p class="card-text"><h5>Уверены, что хотите удалить {{ object.message.theme }}?</h5></p>
            <div class="card-body">
                {% csrf_token %}
            </div>
            <button class="p-2 btn btn-outline-primary" type="submit">Удалить</button>
             <a class="p-2 btn btn-outline-primary" href="{% url 'service:send_list' %}" role="button">Вернуться к рассылкам</a>
        </div>
    </form>
</div>
{% endblock %}
